[application]
loop_frequency = 600
timer_frequency = 60
display_frequency = 60
audio_frequency = 440

[memory]
reserved_end = 0x200
program_end = 0x1000
reserved_read_only = true

[display]
width = 128
height = 64
default_mode = "lores"

[quirks]
vf_reset = false
index_increment = false
display_clipping = true
vy_shifting = false
vx_jumping = true
clear_on_mode_change = true
vf_collision_counter = false
lores_whole_pixel_scrolling = true
wait_for_vblank = false
lores_sprite_handling = "draw_wide"